name: Diagnose release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-release.yml']
  workflow_dispatch:
    inputs:
      run_id:
        description: Failed macOS release run ID
        required: true
        default: '38981197408'
permissions:
  actions: read
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read failed publisher logs using runner authentication
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id || '38981197408' }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/release-failure.log
          python3 - <<'PY'
          from pathlib import Path
          for line in Path('/tmp/release-failure.log').read_text().splitlines()[-45:]:
              safe=line.replace('%','%25').replace('\r','%0D')
              print('::notice::'+safe)
          PY
