name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run site:check
      - run: xvfb-run -a npm run smoke:electron
      - run: npm run check:workspace -- --no-sandbox --ozone-platform=headless --disable-gpu
      - run: npm run check:browser -- --no-sandbox --ozone-platform=headless --disable-gpu
